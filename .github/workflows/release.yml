name: Build and release

# Builds the Linux and Windows installers, installs each one on a clean machine,
# checks that ARES Console starts and answers, and (for v* tags) publishes a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb and tar.gz
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot
          bash packaging/linux/build.sh
      - name: Test .deb install
        run: |
          sudo apt-get install -y ./dist/ares-console_*_all.deb
          ares-console --version
          test -f /usr/share/applications/ares-console.desktop
          ares-console --no-browser --port 8091 --data "$RUNNER_TEMP/deb-data" &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8091/api/version && break; sleep 1; done
          curl -sf http://127.0.0.1:8091/ | grep -q "<title>ARES Console</title>"
          curl -sf -X POST http://127.0.0.1:8091/api/net/open -d '{"name":"CI Net"}'
          curl -sf -X POST http://127.0.0.1:8091/api/checkins -d '{"callsign":"N0CALL","location":"EN71ab"}'
          curl -sf http://127.0.0.1:8091/api/report/1 | grep -q "N0CALL"
          curl -sf -X POST http://127.0.0.1:8091/api/shutdown
      - name: Test tar.gz install (per-user)
        run: |
          mkdir -p "$RUNNER_TEMP/t" && tar -xzf dist/ares-console-*-linux.tar.gz -C "$RUNNER_TEMP/t"
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          sh "$RUNNER_TEMP"/t/ares-console-*/install.sh
          "$HOME/.local/bin/ares-console" --version
          test -f "$HOME/.local/share/applications/ares-console.desktop"
          sh "$RUNNER_TEMP"/t/ares-console-*/uninstall.sh
          test ! -e "$HOME/.local/bin/ares-console"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer and portable zip
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Test installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-Windows-Setup.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\ARES Console"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=`"$dir`"" -Wait
          $py = "$dir\python\python.exe"
          if (-not (Test-Path $py)) { throw "python.exe not installed" }
          & $py -m ares_console --version
          & $py -c "from ares_console import lzhuf; d=b'ARES '*500; assert lzhuf.decompress_b2(lzhuf.compress_b2(d))==d; print('lzhuf ok')"
          $p = Start-Process $py -ArgumentList "-m","ares_console","--no-browser" -WorkingDirectory $dir -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { $v = Invoke-RestMethod http://127.0.0.1:8073/api/version; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw "ARES Console did not start" }
          $v | Format-List
          if (-not $v.data_dir.Contains("ARES-Console")) { throw "unexpected data dir $($v.data_dir)" }
          Invoke-RestMethod -Method Post http://127.0.0.1:8073/api/net/open -Body '{"name":"CI Net"}' | Out-Null
          Invoke-RestMethod -Method Post http://127.0.0.1:8073/api/checkins -Body '{"callsign":"N0CALL"}' | Out-Null
          $r = Invoke-WebRequest http://127.0.0.1:8073/api/report/1 -UseBasicParsing
          if (-not $r.Content.Contains("N0CALL")) { throw "report missing check-in" }
          # the uninstaller must stop the running console and remove the program
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (-not $p.HasExited) { throw "uninstaller did not stop ARES Console" }
          if (Test-Path "$dir\ares_console") { throw "program files left behind" }
          Write-Host "Windows installer test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ARES Console ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/RELEASE_NOTES.md
